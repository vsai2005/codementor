name: Backend tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: pytest + mypy (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      # Throwaway CI containers; these credentials exist only inside this job.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: codementor
          POSTGRES_PASSWORD: codementor
          POSTGRES_DB: codementor_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U codementor -d codementor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Opts the DB-backed integration tests in (see backend/tests/conftest.py).
      TEST_DATABASE_URL: postgresql+psycopg://codementor:codementor@localhost:5433/codementor_test
      PYTHONUNBUFFERED: "1"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Type check
        run: python -m mypy

      - name: Run tests
        run: python -m pytest tests -q -rs -p no:cacheprovider
