services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: codementor-db
    environment:
      POSTGRES_USER: codementor
      POSTGRES_PASSWORD: codementor
      POSTGRES_DB: codementor
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - codementor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codementor -d codementor"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: codementor-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  codementor_pgdata:
