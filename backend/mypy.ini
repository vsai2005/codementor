# Type-checking configuration for the backend application package.
#
#   cd backend && python -m mypy
#
# The settings match the verified baseline (0 errors across app/). Third-party packages
# without type information are ignored rather than stubbed; nothing inside app/ is
# excluded or silenced.
[mypy]
python_version = 3.12
files = app
ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True
show_error_codes = True
pretty = False
