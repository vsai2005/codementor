# Render blueprint for CodeMentor production backend (FastAPI + SQLAlchemy + SAP Learning Engine)
# Serves /health, /api/sap/*, /api/problems/*, /api/learning/*, /api/submissions/*, /api/progress/*

services:
  - type: web
    name: codementor-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "sh -c 'cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT'"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: codementor-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: REDIS_URL
        sync: false
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_TUTOR_KEY_1
        sync: false
      - key: NVIDIA_TUTOR_KEY_2
        sync: false
      - key: NVIDIA_TUTOR_KEY_3
        sync: false
      - key: NVIDIA_TUTOR_KEY_4
        sync: false
      - key: NVIDIA_TUTOR_KEY_5
        sync: false
      - key: NVIDIA_PRACTICE_KEY_1
        sync: false
      - key: NVIDIA_PRACTICE_KEY_2
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest

databases:
  - name: codementor-db
    databaseName: codementor
    user: codementor
    plan: free
    ipAllowList: []
