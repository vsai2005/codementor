# Render blueprint for CodeMentor production backend (FastAPI + SQLAlchemy + SAP Learning Engine)
# Serves /health, /api/auth/*, /api/sap/*, /api/learning/*, /api/problems/*, /api/submissions/*, /api/progress/*, /api/coach/*

services:
  - type: web
    name: codementor-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "sh -c 'cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-proxy-headers'"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: codementor-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: REDIS_URL
        sync: false
      # Client-IP attestation for per-IP rate limits (>= 32 chars). Without it the API still runs
      # (socket-peer fallback) but logs an error and all users share one per-IP bucket.
      # Set the SAME value as PROXY_SHARED_SECRET on the Vercel frontend project. The Vercel
      # middleware sends it with the platform-verified client IP; requests without it are
      # keyed by the socket peer. See backend/app/core/client_ip.py.
      - key: PROXY_SHARED_SECRET
        sync: false
      - key: LLM_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_TUTOR_KEY_1
        sync: false
      - key: NVIDIA_TUTOR_KEY_2
        sync: false
      - key: NVIDIA_TUTOR_KEY_3
        sync: false
      - key: NVIDIA_TUTOR_KEY_4
        sync: false
      - key: NVIDIA_TUTOR_KEY_5
        sync: false
      - key: NVIDIA_PRACTICE_KEY_1
        sync: false
      - key: NVIDIA_PRACTICE_KEY_2
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: codementor-db
    databaseName: codementor
    user: codementor
    plan: free
    ipAllowList: []
