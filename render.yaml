# Render blueprint — backend on Render, database on Neon (free, durable).
#
# Neon (not Render's managed Postgres) holds the data so it PERSISTS across
# restarts/redeploys and doesn't expire. Neon supports pgvector, so the boot
# migration's `CREATE EXTENSION vector` works.
#
# Before deploying, set these in the Render dashboard (Environment tab):
#   DATABASE_URL  -> your Neon connection string, rewritten for psycopg + SSL:
#                    postgresql+psycopg://USER:PASSWORD@HOST/DBNAME?sslmode=require
#   CORS_ORIGINS  -> your frontend origin, e.g. https://your-app.vercel.app
#   ANTHROPIC_API_KEY (and/or OPENAI_API_KEY) -> for tutor/review/embeddings
#   GOOGLE_CLIENT_ID -> only if you use Google sign-in
services:
  - type: web
    name: codementor-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false          # set to your Neon URL (postgresql+psycopg://…?sslmode=require)
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false          # set to your frontend origin, never "*"
      - key: LLM_PROVIDER
        value: anthropic
